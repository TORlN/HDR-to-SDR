name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb ffmpeg  # Install Xvfb and ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        pip install coverage==7.14.1

    # test/smoke_test.py matches '*_test.py' so it's already part of this
    # discovery run. Its small fixtures under test/smoke_test_videos/ are
    # committed (not gitignored) specifically so these tests exercise the
    # real ffmpeg pipeline here instead of skipping -- the large real-world
    # captures in the project root stay gitignored and skip on CI.
    - name: Run tests with coverage
      env:
        # Without this, an xvfb that failed to start would skip ~120 GUI tests
        # instead of failing -- a skip is not an error, so the build would go
        # green with the entire GUI suite unexecuted. Setting it makes a
        # missing display fatal here, while local runs on a machine with no
        # desktop session still skip. See test/_tk_probe.py.
        HDR_REQUIRE_TK: '1'
      run: |
        xvfb-run -a python -m coverage run -m unittest discover -s test -p '*_test.py' -t .

    - name: Coverage report (fails under threshold in .coveragerc)
      run: |
        python -m coverage report

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies into .venv (pyrightconfig.json resolves imports there)
      run: |
        python -m venv .venv
        ./.venv/bin/python -m pip install --upgrade pip
        ./.venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

    # No `src` argument: bare pyright takes its scope from pyrightconfig.json's
    # include (src + test), so test/ is gated too. It used to be checked by
    # nobody, and drifted -- a reportOptionalCall in gui_integration_test.py
    # sat there until it was found by running pyright without the argument.
    # test/ keeps its relaxed rule set (see pyrightconfig.json); this gates the
    # errors those relaxations don't cover.
    #
    # Safe despite src/pro/ being absent here (gitignored, separate private
    # repo): every pro import in src/ goes through importlib.import_module, so
    # pyright never resolves pro statically and its absence changes nothing.
    - name: Type-check src/ and test/ (must be 0 errors)
      run: |
        ./.venv/bin/python -m pyright